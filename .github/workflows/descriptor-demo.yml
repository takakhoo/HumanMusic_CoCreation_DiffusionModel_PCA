name: Reproduce audio-control diagnostic
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-demo.txt
      - run: python -m unittest -v test_descriptor_demo
      - run: python descriptor_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-control-diagnostic
          path: results/descriptor-demo/
